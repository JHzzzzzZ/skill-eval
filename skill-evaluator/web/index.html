<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>skill-evaluator</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--ink:#1c2733;--muted:#64748b;--line:#dbe2ea;
        --pass:#0b7a3d;--warn:#b7791f;--fail:#b23b3b;--accent:#1f2937}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
  header{background:var(--accent);color:#fff;padding:18px 28px}
  header h1{margin:0;font-size:20px} header p{margin:4px 0 0;color:#cbd5e1;font-size:13px}
  main{max-width:1080px;margin:22px auto;padding:0 18px;display:grid;gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  input,select,textarea,button{font:inherit}
  input,select,textarea{width:100%;border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:#fff}
  textarea{min-height:88px;resize:vertical}
  button{background:var(--accent);color:#fff;border:0;border-radius:7px;padding:9px 18px;cursor:pointer}
  button:disabled{opacity:.5;cursor:not-allowed}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .hint{color:var(--muted);font-size:12px}
  .bar{height:9px;background:#e5e9ef;border-radius:99px;overflow:hidden;margin:10px 0}
  .bar i{display:block;height:100%;width:0;background:var(--pass);transition:width .3s}
  .stages{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
  .stage{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:2px 9px;color:var(--muted)}
  .stage.on{border-color:var(--accent);color:var(--accent);font-weight:600}
  .stage.ok{background:#e8f5ee;border-color:#b7e0c9;color:var(--pass)}
  .stage.bad{background:#fdecec;border-color:#f3c2c2;color:var(--fail)}
  pre{background:#0f172a;color:#e2e8f0;border-radius:8px;padding:12px;max-height:340px;overflow:auto;font-size:12px}
  table{border-collapse:collapse;width:100%;font-size:13px} td,th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
  .badge{display:inline-block;border-radius:99px;padding:1px 8px;color:#fff;font-size:12px}
  .pass{background:var(--pass)}.warn{background:var(--warn)}.fail{background:var(--fail)}.skipped{background:#6b7280}
</style>
</head>
<body>
<header>
  <h1>skill-evaluator</h1>
  <p>选档位运行；进度实时推送。只绑 127.0.0.1，不对外网开放。</p>
</header>
<main>
  <section class="card">
    <div class="grid">
      <div>
        <label for="skill">被测 skill 路径（含 SKILL.md）</label>
        <input id="skill" placeholder="C:\path\to\skill">
      </div>
      <div>
        <label for="tier">档位</label>
        <select id="tier">
          <option value="t0">T0 静态</option>
          <option value="t1">T1 LLM 评审</option>
          <option value="t2a" selected>T2A 触发评测</option>
          <option value="t2b">T2B 真实场景 A/B</option>
          <option value="t3">T3 核心沙箱</option>
        </select>
      </div>
      <div>
        <label for="harness">执行载体</label>
        <select id="harness"><option value="pi">pi（当前可用）</option></select>
      </div>
      <div>
        <label for="model">模型（provider/id，可空）</label>
        <input id="model" placeholder="例如 openai/gpt-5">
      </div>
      <div>
        <label for="evalset">评测集目录（可空，自动找 vN）</label>
        <input id="evalset" placeholder="...\evalsets\<name>\v1">
      </div>
      <div>
        <label for="backend">T1 评审后端</label>
        <select id="backend">
          <option value="auto" selected>auto（配置了 llm 就用直连，否则 pi）</option>
          <option value="llm">llm（直连，不经过 pi）</option>
          <option value="pi">pi</option>
        </select>
      </div>
      <div style="grid-column:1/-1">
        <label for="real">真实输入（T2B 用；纯文本或 {"prompt":"...","label":"..."}）</label>
        <textarea id="real" placeholder="粘贴一例真实业务输入；留空则 T2B 跳过"></textarea>
      </div>
    </div>
    <div class="row" style="margin-top:14px">
      <button id="run">开始评估</button>
      <span class="hint" id="state">未运行</span>
    </div>
  </section>

  <section class="card">
    <div class="row" style="justify-content:space-between">
      <strong>进度</strong><span class="hint" id="pct">0%</span>
    </div>
    <div class="bar"><i id="bar"></i></div>
    <div class="stages" id="stages"></div>
    <pre id="log">等待开始…</pre>
  </section>

  <section class="card" id="result" style="display:none">
    <div class="row" style="justify-content:space-between">
      <strong>结果</strong><a id="reportLink" target="_blank">打开报告页 →</a>
    </div>
    <div id="summary" style="margin:10px 0"></div>
    <table id="metrics"></table>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const STAGES = ["T0","T1","T2A","T2B","T3","report"];
const WEIGHT = {T0:5,T1:25,T2A:40,T2B:50,T3:80,report:100};
let es = null, runId = null;

function stageEl(name){
  let el = document.querySelector(`.stage[data-s="${name}"]`);
  if(!el){ el = document.createElement("span"); el.className="stage"; el.dataset.s=name; el.textContent=name; $("stages").appendChild(el); }
  return el;
}
function setProgress(p){ p = Math.max(0, Math.min(100, p)); $("bar").style.width = p+"%"; $("pct").textContent = Math.round(p)+"%"; }
function log(line){ const el=$("log"); el.textContent += (el.textContent==="等待开始…"?"": "\n") + line; el.scrollTop = el.scrollHeight; }

$("run").onclick = async () => {
  const skill = $("skill").value.trim();
  if(!skill){ alert("先填被测 skill 路径"); return; }
  $("run").disabled = true; $("state").textContent = "运行中…"; $("log").textContent = "";
  $("stages").innerHTML = ""; setProgress(0); $("result").style.display = "none";
  try{
    const r = await fetch("/api/run", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({skill, tier:$("tier").value, harness:$("harness").value,
        model:$("model").value.trim(), evalset:$("evalset").value.trim(),
        backend:$("backend").value, real_input:$("real").value.trim()})});
    const data = await r.json();
    if(!r.ok) throw new Error(data.error || "启动失败");
    runId = data.id; listen(data.id);
  }catch(e){ log("✗ "+e.message); $("state").textContent="失败"; $("run").disabled=false; }
};

function listen(id){
  es = new EventSource("/api/events?id="+id);
  es.onmessage = (msg) => {
    let ev; try{ ev = JSON.parse(msg.data); }catch{ return; }
    if(ev.type==="stage"){
      const el = stageEl(ev.name);
      if(ev.status==="start"){ el.className="stage on"; setProgress(Math.max(0,(WEIGHT[ev.name]||0)-8)); }
      if(ev.status==="done"){ el.className="stage ok"; setProgress(WEIGHT[ev.name]||0); }
      if(ev.status==="skipped"){ el.className="stage"; el.textContent = ev.name+"（跳过）"; }
      log(`[${ev.name}] ${ev.status}${ev.reason? " · "+ev.reason:""}`);
    } else if(ev.type==="case"){
      log(`[${ev.stage}] ${ev.index}/${ev.total} ${ev.label||""}`);
      const base = ev.stage==="T2A" ? 25 : 50;
      const span = ev.stage==="T2A" ? 15 : 30;
      setProgress(base + span * (ev.index/Math.max(1,ev.total)));
    } else if(ev.type==="judge"){
      log(`[T1] ${ev.metric} ${ev.status}${ev.error? " · "+ev.error:""}`);
    } else if(ev.type==="warn"){
      log(`⚠ ${ev.stage||""} ${ev.label||""} ${ev.error||""}`);
    } else if(ev.type==="error"){
      log("✗ "+ev.error); $("state").textContent="失败"; finish();
    } else if(ev.type==="done"){
      log("✓ 完成："+ev.report); $("state").textContent="完成"; setProgress(100); finish();
      showReport(id);
    }
  };
  es.onerror = () => { log("连接中断（runner 可能已结束）"); finish(); };
}

function finish(){ if(es){ es.close(); es=null; } $("run").disabled=false; }

async function showReport(id){
  try{
    const r = await fetch("/api/report?id="+id); const rep = await r.json();
    $("result").style.display="block";
    $("summary").innerHTML = `结论：<span class="badge ${rep.conclusion==="all-pass"?"pass":rep.conclusion==="has-failures"?"fail":"warn"}">${rep.conclusion}</span>
      <span class="hint"> · schema ${rep.schema} · ${rep.metrics?Object.keys(rep.metrics).length:0} 项指标</span>`;
    $("reportLink").href = "/report?id="+id;
    const rows = Object.entries(rep.metrics||{}).map(([k,v])=>
      `<tr><td>${k}</td><td>${v.verdict}</td><td>${(v.note||"").replace(/</g,"&lt;")}</td></tr>`).join("");
    $("metrics").innerHTML = `<tr><th>指标</th><th>结果</th><th>摘要</th></tr>${rows}`;
  }catch(e){ log("读报告失败："+e.message); }
}
</script>
</body>
</html>
